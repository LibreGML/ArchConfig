source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
	path =  screenshot
    color = rgb(15, 20, 42)  
    blur_size = 0
    blur_passes = 5
    noise = 0.005
    contrast = 1.5000 
    brightness = 0.7000
    vibrancy = 0.3500
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = rgba(100,200,255, 0.95)
    font_size = 64
    font_family = Maple Mono NF CN SemiBold Italic
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 3
    shadow_color = rgba(0,150,255,0.5)
}

# Hour-Time with neon glow
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"  
    color = rgba(0,255,255, 0.95)
    font_size = 190
    font_family = Maple Mono NF CN SemiBold 
    position = 0, -133
    halign = center
    valign = top
    shadow_passes = 4
    shadow_color = rgba(0,200,255,0.6)
}


# USER with tech badge style
label {
    monitor =
    text =   $USER
    font_size = 48
    font_family =  Maple Mono NF CN SemiBold 
    position = 0, 300
    halign = center
    valign = bottom
    color = rgba(150,255,200, 0.9)
    shadow_passes = 2
    shadow_color = rgba(0,255,150,0.4)
}

# INPUT FIELD with glass morphism
input-field {
    monitor =
    size = 400, 100
    outline_thickness = 3
    dots_size = 0.25 
    dots_spacing = 0.3 
    dots_center = true
    outer_color = rgba(0,200,255, 0.8)
    inner_color = rgba(255, 255, 255, 0.08)
	capslock_color = rgba(0,255,255, 0.9)
    font_color = rgba(0,255,255, 0.95)
    fade_on_empty = false
    font_family =  Maple Mono NF CN SemiBold Italic
    placeholder_text = <i><span foreground="##00ffff99">🔒 芝麻开门!!!</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
    rounding = 15
}

# Keyboard LAYOUT with indicator
label {
    monitor =
    text = $LAYOUT
    color = rgba(255,200,100, 0.9)
    font_size = 19
    font_family = Maple Mono NF CN SemiBold Italic
    position = 0, 53
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_color = rgba(255,150,50,0.4)
}

# uptime with data display style
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p || $Scripts/UptimeNixOS.sh)" </b>"
    color = rgba(180,150,255, 0.9)
    font_size = 32
    font_family = Maple Mono NF CN SemiBold 
    position = 0, 20
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_color = rgba(150,100,255,0.3)
}

label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = rgba(100,255,150, 0.9)
    font_size = 23
    font_family = Maple Mono NF CN SemiBold 
    position = 0, 80
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_color = rgba(50,200,100,0.4)
}
